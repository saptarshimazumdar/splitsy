<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Images/favicon/favicon-16x16.png">
    <link rel="manifest" href="/Images/favicon/site.webmanifest">
    <title>Splitsy - Members</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/collapsible.css">
</head>

<body>
    <h1 class="header">Splitsy</h1>
    <div class="container" id="names-container">
        <form class="form-group-names" id="form-group-names">
            <input type="text" id="persons" name="persons" placeholder="Member name" maxlength="40"
                autocomplete="off">
            <button id="submitNames" type="submit" title="Add member">&#10003;</button>
        </form>
        <div class="members-scroll">
            <table class="added-names" id="added-names">
                <thead>
                    <tr>
                        <th class="names-column">Participants</th>
                        <th class="names-action"></th>
                    </tr>
                </thead>
                <tbody id="namesList">
                    <!-- Names will be added here dynamically -->
                </tbody>
            </table>
        </div>
        <button id="go-back" class="go-back-btn" title="Go Back" onclick="goHome()">&#8656;</button>
        <button id="next-expenses" class="next-btn" title="Add Expenses" onclick="addExpenses()">&#8383;</button>
    </div>

    <div id="message-modal" class="modal confirm-modal" onclick="if (event.target === this) closeMessage()">
        <div class="modal-content history-content">
            <p id="message-text" class="confirm-message"></p>
            <div class="button-holder">
                <button type="button" class="add-expense-btn" title="OK" onclick="closeMessage()">&#10003;</button>
            </div>
        </div>
    </div>

    <script src="scripts/util.js"></script>
    <script src="scripts/store.js"></script>
    <script src="scripts/members.js"></script>
</body>

</html>
