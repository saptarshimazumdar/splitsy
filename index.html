<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/Images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Images/favicon/favicon-16x16.png">
    <link rel="manifest" href="/Images/favicon/site.webmanifest">
    <title>Splitsy</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/modal.css">
    <link rel="stylesheet" href="styles/collapsible.css">
</head>

<body>
    <h1 class="header">Splitsy</h1>
    <div class="container" id="names-container">
        <input type="text" id="group-name" class="group-name" placeholder="Group name" maxlength="60"
            autocomplete="off">
        <button id="previous-expenses" class="previous-expenses" title="History" onclick="revealFromArchived()">&#9201;</button>
        <button id="next-members" class="next-btn" title="Add Members" onclick="addMembers()">&#6308;</button>
    </div>

    <div id="history-modal" class="modal" onclick="if (event.target === this) closeHistory()">
        <div class="modal-content history-content">
            <h2 class="history-title">History</h2>
            <div id="history-list" class="history-list"></div>
            <div class="button-holder">
                <button type="button" class="close-expense-btn" title="Close" onclick="closeHistory()">&#10007;</button>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal confirm-modal" onclick="if (event.target === this) closeConfirm()">
        <div class="modal-content history-content">
            <p id="confirm-message" class="confirm-message"></p>
            <div class="button-holder">
                <button type="button" class="close-expense-btn" title="Cancel" onclick="closeConfirm()">&#10007;</button>
                <button type="button" id="confirm-accept" class="add-expense-btn" title="Confirm">&#10003;</button>
            </div>
        </div>
    </div>

    <div id="message-modal" class="modal confirm-modal" onclick="if (event.target === this) closeMessage()">
        <div class="modal-content history-content">
            <p id="message-text" class="confirm-message"></p>
            <div class="button-holder">
                <button type="button" class="add-expense-btn" title="OK" onclick="closeMessage()">&#10003;</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="scripts/util.js"></script>
    <script src="scripts/store.js"></script>
    <script src="scripts/home.js"></script>
</body>

</html>
